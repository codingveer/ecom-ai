<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neu.Tail — Shop</title>
<style>
  :root{
    --ink:#101014; --paper:#fff; --rule:#E4E4E7; --mute:#71717A;
    --front:#FAFAFA; --accent:#5B4B9E; --warn-bg:#FBEFE9;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper)}
  .caps{text-transform:uppercase;letter-spacing:.09em}

  header{border-bottom:1px solid var(--rule);padding:18px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  .nav-left{display:flex;gap:22px;align-items:center}
  .nav-left button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;padding:0}
  .nav-left button.active{color:var(--ink)}
  .brand{text-align:center;font-size:19px;font-weight:700;letter-spacing:.03em}
  .nav-right{display:flex;gap:18px;align-items:center;justify-content:flex-end;font-size:12px;font-weight:600;position:relative}
  .nav-right button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;padding:0}
  .nav-right .muted{color:var(--mute);font-weight:500}
  .account-menu{position:absolute;top:26px;right:0;background:#fff;border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);min-width:170px;padding:6px;display:none;z-index:30}
  .account-menu.open{display:block}
  .account-menu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink)}
  .account-menu button:hover{background:var(--front)}
  .account-menu .divider{border-top:1px solid var(--rule);margin:5px 2px}

  @media (max-width:640px){
    header{grid-template-columns:auto auto;justify-content:space-between;row-gap:10px}
    .brand{grid-column:1/3;order:-1;text-align:left;font-size:16px}
    .nav-right .muted{display:none}
  }

  main{max-width:1100px;margin:0 auto;padding:28px 24px 70px}

  .search-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
  .search-row svg{flex:0 0 auto;opacity:.5}
  .search-row input{flex:1;border:0;outline:0;font:inherit;font-size:15px;padding:4px 0}
  .search-row button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;cursor:pointer}

  .semantic-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);margin-bottom:22px;cursor:pointer;user-select:none}
  .semantic-toggle input{cursor:pointer}

  .trending{margin-bottom:28px}
  .trending .label{font-size:11px;color:var(--mute);margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:16px 18px}
  .chip{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0}
  .chip:hover{color:var(--accent)}

  .section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .section-head h2{font-size:12px;margin:0;margin-right:auto}
  .section-head .count{font-size:12px;color:var(--mute)}
  .mode-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .mode-badge.semantic{background:var(--accent);color:#fff}
  .mode-badge.degraded{background:var(--warn-bg);color:#8A4B2A}
  .blurb{font-size:12.5px;color:var(--mute);margin-bottom:20px;max-width:70ch}
  .blurb b{color:var(--ink);font-weight:600}
  .why{color:var(--accent);cursor:pointer;font-weight:600;display:inline-block;margin-top:4px}
  .why-body{display:none;margin-top:6px}
  .why-body.open{display:block}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px 16px}
  .card{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .card .ph{position:relative;aspect-ratio:3/4;background:var(--front);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:9px;left:9px;background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:4px 7px;text-transform:uppercase}
  .save{position:absolute;top:8px;right:8px;width:26px;height:26px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
  .card .body{padding-top:9px}
  .card .brand{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .card .title{font-size:13px;font-weight:500;margin:2px 0 4px}
  .card .price{font-weight:700;font-size:13px}
  .card .meta{font-size:11px;color:var(--mute);margin-top:2px}
  .empty{color:var(--mute);font-size:13px}

  .overlay{position:fixed;inset:0;background:rgba(16,16,20,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:40}
  .overlay.open{display:flex}
  .panel{background:#fff;max-width:760px;width:100%;position:relative;display:grid;grid-template-columns:1fr 1fr}
  @media (max-width:640px){.panel{grid-template-columns:1fr}}
  .close{position:absolute;top:14px;right:16px;border:0;background:none;font-size:22px;cursor:pointer;z-index:2}
  .panel .ph{background:var(--front);display:flex;align-items:center;justify-content:center;font-size:80px;min-height:320px;overflow:hidden}
  .panel .ph img{width:100%;height:100%;object-fit:cover}
  .pd-info{padding:30px}
  .pd-info .brand{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
  .pd-info h2{font-size:19px;font-weight:500;margin:4px 0 8px}
  .pd-info .price{font-size:16px;font-weight:700;margin-bottom:4px}
  .pd-info .meta{font-size:12px;color:var(--mute);margin-bottom:20px}
  .size-label{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:8px}
  .size-label .caps{color:var(--mute)}
  .ai-tag{font-size:11px;color:var(--accent);font-weight:600}
  .size-row{display:flex;gap:8px;margin-bottom:6px}
  .size-box{border:1px solid var(--rule);background:#fff;width:44px;height:40px;font-size:12.5px;font-weight:600;cursor:pointer;position:relative}
  .size-box.selected{background:var(--ink);color:#fff;border-color:var(--ink)}
  .size-box.ai-pick{border:2px solid var(--accent)}
  .size-note{font-size:11.5px;color:var(--mute);margin:8px 0 18px;min-height:14px}
  .size-note.warn{color:var(--ink)}
  .why-fit{color:var(--accent);cursor:pointer;font-weight:600}
  .btn{border:0;padding:13px 16px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;width:100%}
  .btn.primary{background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.06em}
  .btn.ghost{background:#fff;border:1px solid var(--rule);color:var(--ink);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}

  .signin-panel{max-width:420px;padding:34px}
  .signin-panel h2{font-size:16px;margin:0 0 4px}
  .signin-panel .sub{font-size:12.5px;color:var(--mute);margin-bottom:22px}
  .acct-tile{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--rule);padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .acct-tile:hover{border-color:var(--ink)}
  .acct-tile .name{font-weight:600;font-size:13.5px}
  .acct-tile .note{font-size:11.5px;color:var(--mute);margin-top:2px}
  .acct-tile .arrow{color:var(--mute)}
  .guest-link{text-align:center;font-size:12.5px;color:var(--mute);margin-top:14px}
  .guest-link button{border:0;background:none;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;padding:0}

  .cards-2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:1px}
  @media (max-width:700px){.cards-2{grid-template-columns:1fr}}
  .acct-card{background:#fff;padding:22px;border:1px solid var(--rule);border-top:0;margin-bottom:-1px}
  .cards-2 .acct-card{border:0}
  .acct-card h3{font-size:11px;margin:0 0 10px}
  .bar{height:4px;background:var(--front);overflow:hidden;margin:10px 0}
  .bar>div{height:100%;background:var(--accent)}
  .redeem-row{display:flex;gap:8px;margin-top:12px}
  .redeem-row input{width:90px;border:1px solid var(--rule);padding:9px 10px;font:inherit}
  .redeem-row button{border:1px solid var(--ink);background:#fff;padding:9px 14px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .gate{padding:40px 0;text-align:center}
  .gate p{color:var(--mute);font-size:13px;margin-bottom:16px}
  .gate button{border:0;background:var(--ink);color:#fff;padding:12px 22px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<header>
  <nav class="nav-left" id="tabs">
    <button data-view="shop" class="caps active">Shop</button>
    <button data-view="account" class="caps">Account</button>
  </nav>
  <div class="brand">NEU.TAIL</div>
  <div class="nav-right">
    <a href="/index.html" class="muted" style="text-decoration:none">Technical console</a>
    <span id="authArea"></span>
    <button id="cartBtn">Bag (<span id="cartCount">0</span>)</button>
  </div>
</header>

<main>
  <section id="view-shop">
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="Search for anything..." autocomplete="off">
      <button id="searchBtn" class="caps">Search</button>
    </div>
    <label class="semantic-toggle"><input type="checkbox" id="semanticToggle"> Semantic search <span class="muted">(embedding-based, understands meaning not just keywords)</span></label>
    <div class="trending">
      <div class="label caps">Trending</div>
      <div class="chips" id="pills"></div>
    </div>
    <div id="resultsHead"></div>
    <div id="blurb"></div>
    <div class="grid" id="grid"><p class="empty">Search for something, or pick a trending term, to see results personalised to you.</p></div>
  </section>

  <section id="view-account" style="display:none"></section>
</main>

<div class="overlay" id="overlay">
  <div class="panel" id="panelBody"></div>
</div>

<script>
const PERSONAS = [
  { id:'C001', name:'Priya', note:'Affluent, loyal, rich fit history' },
  { id:'C002', name:'Aditi',  note:'Value-seeking, new, no fit consent' },
  { id:'C003', name:'Meera', note:'Free tier, third styling session' },
  { id:'C004', name:'Arjun', note:'Menswear department, mid affluence' },
];
const GUEST_ID = 'C000';

let customerId = GUEST_ID;
let sessionId = 'shop-' + customerId + '-' + Date.now();
let currentView = 'shop';
let cartCount = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const personaOf = id => PERSONAS.find(p => p.id === id) || null;
const isSignedIn = () => customerId !== GUEST_ID;

async function ask(text, extra = {}){
  try {
    const r = await fetch(`/session/${sessionId}/message`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ customerId, text, ...extra })
    });
    return await r.json();
  } catch (e) {
    return { error:'unreachable', reply:'The shop backend is not reachable. Start the stack with npm run dev.' };
  }
}

function switchTo(id){
  customerId = id;
  sessionId = 'shop-' + customerId + '-' + Date.now();
  cartCount = 0; $('cartCount').textContent = '0';
  $('grid').innerHTML = '<p class="empty">Search for something, or pick a trending term, to see results personalised to you.</p>';
  $('blurb').innerHTML = ''; $('resultsHead').innerHTML = '';
  $('search').value = '';
  $('overlay').classList.remove('open');
  renderAuthArea();
  if (currentView === 'account') renderAccountView();
}

function renderAuthArea(){
  const p = personaOf(customerId);
  if (!p) {
    $('authArea').innerHTML = `<button id="signInBtn" class="caps">Sign In</button>`;
    $('signInBtn').onclick = openSignIn;
    return;
  }
  $('authArea').innerHTML = `
    <button id="acctToggle">${esc(p.name)} ▾</button>
    <div class="account-menu" id="acctMenu">
      ${PERSONAS.filter(x => x.id !== p.id).map(x => `<button data-switch="${x.id}">Switch to ${esc(x.name)}</button>`).join('')}
      <div class="divider"></div>
      <button id="signOutBtn">Sign out</button>
    </div>`;
  $('acctToggle').onclick = () => $('acctMenu').classList.toggle('open');
  document.querySelectorAll('[data-switch]').forEach(b => b.onclick = () => { $('acctMenu').classList.remove('open'); switchTo(b.dataset.switch); });
  $('signOutBtn').onclick = () => { $('acctMenu').classList.remove('open'); switchTo(GUEST_ID); };
}
document.addEventListener('click', e => {
  const menu = $('acctMenu'); const toggle = $('acctToggle');
  if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== toggle) menu.classList.remove('open');
});

function openSignIn(){
  $('panelBody').innerHTML = `
    <div class="signin-panel">
      <button class="close" id="closeOverlay">×</button>
      <h2>Sign in</h2>
      <div class="sub">Choose a demo account to see personalisation in action.</div>
      ${PERSONAS.map(p => `
        <div class="acct-tile" data-tile="${p.id}">
          <div><div class="name">${esc(p.name)}</div><div class="note">${esc(p.note)}</div></div>
          <div class="arrow">→</div>
        </div>`).join('')}
      <div class="guest-link">or <button id="continueGuest">continue browsing as a guest</button></div>
    </div>`;
  $('overlay').classList.add('open');
  $('closeOverlay').onclick = () => $('overlay').classList.remove('open');
  document.querySelectorAll('[data-tile]').forEach(t => t.onclick = () => { $('overlay').classList.remove('open'); switchTo(t.dataset.tile); });
  $('continueGuest').onclick = () => $('overlay').classList.remove('open');
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  currentView = b.dataset.view;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  $('view-shop').style.display = currentView === 'shop' ? '' : 'none';
  $('view-account').style.display = currentView === 'account' ? '' : 'none';
  if (currentView === 'account') renderAccountView();
});

renderAuthArea();
</script>

<script>
const TRENDING = ['Occasion dress','Winter coat','Knit jumper','Work trousers','Trainers'];
const CAT_ICON = { dresses:'👗', outerwear:'🧥', knitwear:'🧶', trousers:'👖', tops:'👕', skirts:'👗', footwear:'👟', accessories:'👜' };
let lastProducts = [];

$('pills').innerHTML = TRENDING.map(c => `<button class="chip">${esc(c)}</button>`).join('');
document.querySelectorAll('.chip').forEach(p => p.onclick = () => { $('search').value = p.textContent; runSearch(); });
$('searchBtn').onclick = runSearch;
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

async function runSearch(){
  const text = $('search').value.trim();
  if (!text) return;
  $('grid').innerHTML = '<p class="empty">Searching…</p>';
  $('blurb').innerHTML = ''; $('resultsHead').innerHTML = '';
  const semanticSearch = $('semanticToggle').checked;
  const d = await ask(text, semanticSearch ? { semanticSearch: true } : {});
  if (d.error) { $('grid').innerHTML = `<p class="empty">${esc(d.reply)}</p>`; return; }
  if (d.intent !== 'discovery.rank' || !d.payload?.products) {
    $('grid').innerHTML = `<p class="empty">${esc(d.reply || 'No results for that.')}</p>`;
    return;
  }
  lastProducts = d.payload.products;
  const modeNote = d.trace?.find(t => t.label?.startsWith('catalogue.search served'));
  const modeBadge = semanticSearch
    ? `<span class="mode-badge ${modeNote?.detail?.degraded ? 'degraded' : 'semantic'}">${modeNote?.detail?.degraded ? 'semantic unavailable — fell back to keyword match' : 'semantic match'}</span>`
    : '';
  $('resultsHead').innerHTML = `<div class="section-head"><h2 class="caps">Results</h2><span class="count">${d.payload.candidates} products</span>${modeBadge}</div>`;
  const mix = Object.entries(d.payload.price_tier_mix || {}).map(([t,n]) => `${n} ${t}`).join(', ');
  $('blurb').innerHTML = `<div class="blurb"><b>Personalised for you</b> — ${esc(d.payload.rationale)}
    <div class="why" id="whyToggle">Why am I seeing this? ▾</div>
    <div class="why-body" id="whyBody">Ranked ${d.payload.candidates} eligible products; the top 5 mix is ${esc(mix)}.</div>
  </div>`;
  $('whyToggle').onclick = () => $('whyBody').classList.toggle('open');
  if (!lastProducts.length) { $('grid').innerHTML = '<p class="empty">No stocked products matched that search.</p>'; return; }
  $('grid').innerHTML = lastProducts.map((p,i) => `
    <button class="card" data-i="${i}">
      <div class="ph">
        ${i === 0 ? '<span class="badge">Top pick</span>' : ''}
        <span class="save">♡</span>
        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : (CAT_ICON[p.category] || '🛍️')}
      </div>
      <div class="body">
        <div class="brand">${esc(p.brand)}</div>
        <div class="title">${esc(p.title)}</div>
        <div class="price">£${p.price_gbp}</div>
        <div class="meta">★ ${p.rating} · ${p.stock > 8 ? 'In stock' : p.stock > 0 ? 'Low stock' : 'Out of stock'}</div>
      </div>
    </button>`).join('');
  document.querySelectorAll('#grid .card').forEach(c => c.onclick = () => openProduct(lastProducts[+c.dataset.i]));
}
</script>

<script>
function openProduct(p){
  $('panelBody').innerHTML = `
    <button class="close" id="closeOverlay">×</button>
    <div class="ph">${p.image_url ? `<img src="${esc(p.image_url)}" alt="" onerror="this.remove()">` : (CAT_ICON[p.category] || '🛍️')}</div>
    <div class="pd-info">
      <div class="brand">${esc(p.brand)}</div>
      <h2>${esc(p.title)}</h2>
      <div class="price">£${p.price_gbp}</div>
      <div class="meta">★ ${p.rating} · ${p.stock > 8 ? 'In stock' : p.stock > 0 ? 'Low stock' : 'Out of stock'}</div>
      <div class="size-label"><span class="caps">Size</span><span id="aiTag" class="ai-tag"></span></div>
      <div class="size-row" id="sizeRow">${['XS','S','M','L','XL'].map(s => `<button class="size-box" data-size="${s}">${s}</button>`).join('')}</div>
      <div class="size-note" id="sizeNote">Finding your size…</div>
      <button class="btn primary" id="addBag">Add to bag</button>
    </div>
  `;
  $('overlay').classList.add('open');
  $('closeOverlay').onclick = () => $('overlay').classList.remove('open');
  document.querySelectorAll('#sizeRow .size-box').forEach(box => box.onclick = () => {
    document.querySelectorAll('#sizeRow .size-box').forEach(b => b.classList.remove('selected'));
    box.classList.add('selected');
  });
  $('addBag').onclick = () => { cartCount++; $('cartCount').textContent = String(cartCount); };

  // Fetch the AI's size recommendation automatically - no button required.
  ask(`what size should I get for ${p.sku}?`).then(d => {
    if (d.error) { $('sizeNote').textContent = ''; return; }
    const f = d.payload || {};
    if (f.abstained) {
      $('sizeNote').innerHTML = `${esc(f.explanation)} <span class="why-fit" id="whyFit">Why? ▾</span><div class="why-body" id="whyFitBody">${esc(JSON.stringify(f.evidence || {}))}</div>`;
    } else {
      $('aiTag').textContent = `AI pick: ${f.recommended_size} · ${f.confidence}%`;
      document.querySelectorAll('#sizeRow .size-box').forEach(box => {
        if (box.dataset.size === f.recommended_size) box.classList.add('ai-pick');
      });
      $('sizeNote').innerHTML = `${esc(f.explanation)} <span class="why-fit" id="whyFit">Why? ▾</span><div class="why-body" id="whyFitBody">Body-metric match ${f.evidence?.grading_delta}σ from typical ${f.recommended_size} · ${f.evidence?.observations} kept purchases · brand cut ${esc(String(f.evidence?.brand_cut || ''))}</div>`;
    }
    const whyFit = $('whyFit');
    if (whyFit) whyFit.onclick = () => $('whyFitBody').classList.toggle('open');
  });
}
</script>

<script>
async function renderAccountView(){
  if (!isSignedIn()) {
    $('view-account').innerHTML = `
      <div class="gate">
        <p>Sign in to view your profile, subscription and loyalty points.</p>
        <button id="gateSignIn" class="caps">Sign In</button>
      </div>`;
    $('gateSignIn').onclick = openSignIn;
    return;
  }
  $('view-account').innerHTML = `
    <div class="cards-2">
      <div class="acct-card"><h3 class="caps">Profile</h3><div id="profileBody" class="empty">Loading…</div></div>
      <div class="acct-card"><h3 class="caps">Subscription</h3><div id="subBody" class="empty">Loading…</div></div>
    </div>
    <div class="acct-card">
      <h3 class="caps">Loyalty points</h3>
      <div id="loyaltyBody" class="empty">Simulate a purchase to see your balance and tier progress.</div>
      <button class="btn ghost" id="simPurchase">Simulate a purchase</button>
      <div class="redeem-row">
        <input type="number" id="redeemAmt" placeholder="Points" min="0">
        <button id="redeemBtn">Redeem</button>
      </div>
      <div id="redeemResult"></div>
    </div>`;

  const p = await ask('who am I');
  if (!p.error && p.payload?.segment) {
    const seg = p.payload.segment;
    $('profileBody').innerHTML = `<div>${esc(String(seg.affluence).replace('_',' '))} · ${esc(seg.loyalty_status)}
      <div class="meta">Tier ${esc(seg.tier)} · ${seg.evidence.orders} orders · ${seg.evidence.tenure_days} days as a customer</div></div>`;
  }

  const u = await ask('tell me about the styling advisory plan');
  if (u.error) { $('subBody').innerHTML = `<p class="empty">${esc(u.reply)}</p>`; }
  else if (u.payload?.offer) {
    $('subBody').innerHTML = `<p>${esc(u.payload.offer.copy)}</p>
      <button class="btn primary" id="acceptOffer">Accept · £${u.payload.offer.price_gbp_month}/mo</button>`;
    $('acceptOffer').onclick = async () => { const a = await ask('accept'); $('subBody').innerHTML = `<p>${esc(a.reply)}</p>`; };
  } else {
    $('subBody').innerHTML = `<p class="empty">${esc(u.reply)}</p>`;
  }

  $('simPurchase').onclick = async () => {
    $('loyaltyBody').innerHTML = '<p class="empty">Recording purchase…</p>';
    const d = await ask('how many points did I earn?');
    if (d.error) { $('loyaltyBody').innerHTML = `<p class="empty">${esc(d.reply)}</p>`; return; }
    const r = d.payload || {};
    const pct = r.tier === 'Platinum' ? 100 : Math.max(4, 100 - Math.min(100, (r.points_to_next_tier || 0) / 20));
    $('loyaltyBody').innerHTML = `<p>${esc(r.nudge || d.reply)}</p>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="meta">Balance ${r.balance} · Tier ${esc(r.tier || '')}</div>`;
  };

  $('redeemBtn').onclick = async () => {
    const n = $('redeemAmt').value;
    if (!n) return;
    const d = await ask(`redeem ${n}`);
    $('redeemResult').innerHTML = `<p class="meta">${esc(d.reply)}</p>`;
  };
}
</script>
</body>
</html>
