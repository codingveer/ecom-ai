<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neu.Tail — Personalised Fashion Storefront</title>
<style>
  :root {
    --ink: #0f172a;
    --paper: #ffffff;
    --canvas: #f8fafc;
    --card-bg: #ffffff;
    --rule: #e2e8f0;
    --rule-subtle: #f1f5f9;
    --mute: #64748b;
    --mute-light: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-light: #eef2ff;
    --accent-border: #c7d2fe;
    --gold: #f59e0b;
    --emerald: #10b981;
    --emerald-bg: #ecfdf5;
    --warn-bg: #fef3c7;
    --warn-ink: #92400e;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-full: 9999px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 16px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 8px -2px rgba(15, 23, 42, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  .caps { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; }

  /* ------------------- HEADER ------------------- */
  header {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    padding: 14px 28px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    z-index: 25;
  }
  .nav-left { display: flex; gap: 8px; align-items: center; }
  .tab-btn {
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--mute);
    cursor: pointer;
    padding: 6px 14px;
    border-radius: var(--radius-full);
    transition: all .15s ease;
  }
  .tab-btn:hover { color: var(--ink); background: var(--rule-subtle); }
  .tab-btn.active { color: var(--ink); background: var(--rule-subtle); }

  .brand-area { text-align: center; }
  .brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .16em;
    color: var(--ink);
    text-decoration: none;
    display: inline-block;
  }
  .brand-sub { font-size: 9.5px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; margin-top: -2px; }

  .nav-right {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: flex-end;
    font-size: 13px;
    font-weight: 600;
    position: relative;
  }
  .nav-link {
    color: var(--mute);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    transition: color .15s;
  }
  .nav-link:hover { color: var(--ink); }

  .persona-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--canvas);
    border: 1px solid var(--rule);
    padding: 6px 13px;
    border-radius: var(--radius-full);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: all .15s;
  }
  .persona-btn:hover { border-color: var(--mute-light); background: #fff; }
  .persona-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); }

  .account-menu {
    position: absolute;
    top: 40px;
    right: 70px;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    min-width: 220px;
    padding: 8px;
    display: none;
    z-index: 30;
  }
  .account-menu.open { display: block; }
  .account-menu-header { padding: 8px 12px 6px; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .account-menu button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border: 0;
    background: none;
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s;
  }
  .account-menu button:hover { background: var(--canvas); }
  .account-menu .divider { border-top: 1px solid var(--rule); margin: 6px 4px; }

  .bag-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: opacity .15s;
  }
  .bag-btn:hover { opacity: .9; }
  .bag-badge {
    background: #fff;
    color: var(--ink);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: var(--radius-full);
    min-width: 18px;
    text-align: center;
  }

  @media (max-width: 768px) {
    header { grid-template-columns: auto auto; justify-content: space-between; padding: 12px 16px; }
    .brand-area { grid-column: 1/3; order: -1; text-align: left; }
    .nav-link { display: none; }
  }

  /* ------------------- MAIN CONTAINER ------------------- */
  main { max-width: 1140px; margin: 0 auto; padding: 32px 24px 80px; }

  /* ------------------- SEARCH HERO ------------------- */
  .search-hero {
    margin-bottom: 28px;
  }
  .search-bar-wrap {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-full);
    padding: 6px 8px 6px 18px;
    box-shadow: var(--shadow-sm);
    transition: all .2s ease;
    gap: 10px;
  }
  .search-bar-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12), var(--shadow-md);
  }
  .search-icon { color: var(--mute-light); flex: 0 0 auto; display: flex; align-items: center; }
  .search-input {
    flex: 1;
    border: 0;
    outline: 0;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    padding: 6px 0;
    background: transparent;
  }
  .search-input::placeholder { color: var(--mute-light); }

  .clear-btn {
    border: 0;
    background: var(--canvas);
    color: var(--mute);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .clear-btn.visible { display: flex; }
  .clear-btn:hover { background: var(--rule); color: var(--ink); }

  /* AI Mode Toggle Inside Search Bar */
  .ai-toggle-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--canvas);
    border: 1px solid var(--rule);
    border-radius: var(--radius-full);
    padding: 6px 12px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--mute);
    transition: all .2s ease;
    white-space: nowrap;
  }
  .ai-toggle-pill input { display: none; }
  .ai-toggle-pill .sparkle { font-size: 13px; color: var(--mute-light); transition: color .2s; }
  .ai-toggle-pill:hover { border-color: var(--accent-border); color: var(--ink); }
  .ai-toggle-pill.active {
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    border-color: #4f46e5;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
  }
  .ai-toggle-pill.active .sparkle { color: #fef08a; }

  .search-submit-btn {
    border: 0;
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 9px 20px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .search-submit-btn:hover { background: #1e293b; transform: scale(1.02); }

  /* ------------------- DISCOVERY PROMPTS & TRENDING ------------------- */
  .discovery-sections {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .prompt-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .prompt-label { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; min-width: 90px; }
  .prompt-chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }

  .trending-chip {
    border: 1px solid var(--rule);
    background: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    padding: 5px 12px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all .15s ease;
  }
  .trending-chip:hover { border-color: var(--ink); background: var(--canvas); }

  .ai-prompt-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--accent-border);
    background: var(--accent-light);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent-hover);
    padding: 5px 12px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all .15s ease;
  }
  .ai-prompt-chip:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
  }

  /* ------------------- CATEGORY FILTER TABS ------------------- */
  .category-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule-subtle);
  }
  .cat-pill {
    border: 1px solid var(--rule);
    background: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--mute);
    padding: 6px 14px;
    border-radius: var(--radius-full);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .cat-pill:hover { color: var(--ink); border-color: var(--mute-light); }
  .cat-pill.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    font-weight: 600;
  }

  /* ------------------- PERSONALISATION INSIGHT CARD ------------------- */
  .ai-card {
    background: linear-gradient(135deg, #faf5ff 0%, #f5f3ff 50%, #eef2ff 100%);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .ai-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .ai-card-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--accent-border);
    color: var(--accent-hover);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 3px 10px;
    border-radius: var(--radius-full);
  }
  .ai-card-guardrail {
    font-size: 11px;
    font-weight: 600;
    color: var(--emerald);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    border: 1px solid #a7f3d0;
  }
  .ai-card-body {
    font-size: 13.5px;
    color: #334155;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .ai-card-why {
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color .15s;
  }
  .ai-card-why:hover { color: var(--accent-hover); }
  .ai-card-details {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(199, 210, 254, 0.6);
    font-size: 12.5px;
    color: #475569;
  }
  .ai-card-details.open { display: block; }
  .mix-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .mix-pill {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-weight: 600;
  }

  /* ------------------- RESULTS HEADER & TOOLBAR ------------------- */
  .results-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .results-meta { display: flex; align-items: center; gap: 10px; }
  .results-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  .results-count { font-size: 13px; color: var(--mute); font-weight: 500; }

  .mode-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .mode-badge.hybrid { background: var(--accent-light); color: var(--accent-hover); border: 1px solid var(--accent-border); }
  .mode-badge.lexical { background: var(--canvas); color: var(--mute); border: 1px solid var(--rule); }
  .mode-badge.degraded { background: var(--warn-bg); color: var(--warn-ink); }

  .sort-select {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    background: #fff;
    outline: 0;
    cursor: pointer;
  }
  .sort-select:hover { border-color: var(--mute-light); }

  /* ------------------- PRODUCT GRID & CARDS ------------------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 24px 18px;
  }

  .product-card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    text-align: left;
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .25s cubic-bezier(0.16, 1, 0.3, 1), border-color .2s;
    position: relative;
  }
  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: #cbd5e1;
  }

  .card-media {
    position: relative;
    aspect-ratio: 3/4;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .35s ease;
  }
  .product-card:hover .card-media img { transform: scale(1.05); }
  .card-placeholder-icon { font-size: 56px; opacity: .8; }

  .top-pick-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 4px 9px;
    border-radius: var(--radius-full);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 2;
  }
  .top-pick-badge .star { color: #fef08a; }

  .wishlist-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(4px);
    border-radius: 50%;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--mute);
    cursor: pointer;
    transition: all .15s ease;
    z-index: 2;
  }
  .wishlist-btn:hover { transform: scale(1.1); color: #ef4444; background: #fff; }
  .wishlist-btn.saved { color: #ef4444; }

  .card-details {
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .card-brand {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--mute);
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
    margin: 0 0 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 36px;
  }
  .card-price-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: auto;
    padding-top: 4px;
  }
  .card-price {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
  }
  .card-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--rule-subtle);
    font-size: 11.5px;
    color: var(--mute);
  }
  .card-rating { display: flex; align-items: center; gap: 3px; font-weight: 600; color: #334155; }
  .card-rating .star { color: var(--gold); }
  .stock-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
  }
  .stock-dot { width: 6px; height: 6px; border-radius: 50%; }
  .stock-dot.in-stock { background: var(--emerald); }
  .stock-dot.low-stock { background: var(--gold); }
  .stock-dot.out-stock { background: var(--mute-light); }

  /* ------------------- SHIMMER LOADING SKELETON ------------------- */
  .skeleton-card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .skeleton-media {
    aspect-ratio: 3/4;
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  .skeleton-body { padding: 14px; }
  .skeleton-line {
    height: 12px;
    border-radius: 4px;
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 8px;
  }
  .skeleton-line.short { width: 45%; }
  .skeleton-line.medium { width: 75%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--mute);
    max-width: 480px;
    margin: 0 auto;
    grid-column: 1 / -1;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .7; }
  .empty-state h3 { font-size: 16px; color: var(--ink); margin: 0 0 6px; font-weight: 700; }
  .empty-state p { font-size: 13px; margin: 0; line-height: 1.5; }

  /* ------------------- MODAL OVERLAY ------------------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .panel {
    background: #fff;
    max-width: 820px;
    width: 100%;
    border-radius: var(--radius-lg);
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    animation: modalIn .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  @media (max-width: 700px) { .panel { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; } }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, 0.9);
    font-size: 18px;
    color: var(--mute);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: all .15s;
  }
  .modal-close:hover { background: #fff; color: var(--ink); transform: scale(1.08); }

  .panel-media {
    background: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 380px;
    overflow: hidden;
  }
  .panel-media img { width: 100%; height: 100%; object-fit: cover; }

  .pd-info { padding: 32px 28px; display: flex; flex-direction: column; }

<body>

<header>
  <nav class="nav-left" id="tabs">
    <button data-view="shop" class="tab-btn active">Shop</button>
    <button data-view="account" class="tab-btn">Account</button>
  </nav>

  <div class="brand-area">
    <a href="#" class="brand">NEU.TAIL</a>
    <div class="brand-sub">AI Fashion Personalisation</div>
  </div>

  <div class="nav-right">
    <a href="/index.html" class="nav-link">Technical console ↗</a>
    <span id="authArea"></span>
    <button class="bag-btn" id="cartBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Bag</span>
      <span class="bag-badge" id="cartCount">0</span>

</header>

<main>
  <!-- ------------------- SHOP VIEW ------------------- -->
  <section id="view-shop">
    <div class="search-hero">
      <div class="search-bar-wrap">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="search" class="search-input" placeholder="Search for anything (e.g. warm clothes this winter, silk wrap dress, workwear)..." autocomplete="off">
        <button type="button" class="clear-btn" id="clearSearchBtn" title="Clear search">×</button>

        <label class="ai-toggle-pill active" id="aiToggleLabel" title="Enables Workers AI vector embeddings + hybrid scoring">
          <input type="checkbox" id="semanticToggle" checked>

    <!-- Category Filter Tabs -->
    <div class="category-filter-row" id="categoryRow">
      <button class="cat-pill active" data-cat="">All Items</button>

      <button class="cat-pill" data-cat="knitwear">Knitwear 🧶</button>
      <button class="cat-pill" data-cat="tops">Tops 👕</button>
      <button class="cat-pill" data-cat="trousers">Trousers 👖</button>

    <div id="resultsHead"></div>
    <div id="blurb"></div>

      <div class="empty-state">
        <div class="empty-icon">🛍️</div>
        <h3>Explore the Personalised Catalogue</h3>
        <p>Type a query above or click any trending term to see AI-ranked products tailored to your segment and taste.</p>
      </div>

  <!-- ------------------- ACCOUNT VIEW ------------------- -->
  <section id="view-account" style="display:none"></section>
</main>

<!-- ------------------- PRODUCT DETAIL / SIGNIN OVERLAY ------------------- -->
<div class="overlay" id="overlay">
  <div class="panel" id="panelBody"></div>
</div>

<script>
const PERSONAS = [
  { id:'C001', name:'Priya', note:'Affluent, loyal, rich fit history' },
  { id:'C002', name:'Aditi',  note:'Value-seeking, new, no fit consent' },
  { id:'C003', name:'Meera', note:'Free tier, third styling session' },
  { id:'C004', name:'Arjun', note:'Menswear department, mid affluence' },
];
const GUEST_ID = 'C000';

let customerId = GUEST_ID;
let sessionId = 'shop-' + customerId + '-' + Date.now();
let currentView = 'shop';
let cartCount = 0;
let activeCategory = '';
let currentSort = 'default';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const personaOf = id => PERSONAS.find(p => p.id === id) || null;
const isSignedIn = () => customerId !== GUEST_ID;

async function ask(text, extra = {}){
  try {
    const r = await fetch(`/session/${sessionId}/message`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ customerId, text, ...extra })
    });
    const d = await r.json();
    if (d.error && !d.reply) d.reply = d.detail || 'Something went wrong. Please try again.';
    return d;
  } catch (e) {
    return { error:'unreachable', reply:'The shop backend is not reachable. Start the stack with npm run dev.' };
  }
}

function switchTo(id){
  customerId = id;
  sessionId = 'shop-' + customerId + '-' + Date.now();
  cartCount = 0; $('cartCount').textContent = '0';
  $('grid').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🛍️</div>
      <h3>Switched to ${esc(personaOf(customerId)?.name || 'Guest')}</h3>
      <p>Search for something or click a prompt to see products personalised to this shopper's profile.</p>
    </div>`;
  $('blurb').innerHTML = ''; $('resultsHead').innerHTML = '';
  $('search').value = '';
  $('clearSearchBtn').classList.remove('visible');
  $('overlay').classList.remove('open');
  renderAuthArea();
  if (currentView === 'account') renderAccountView();
}

function renderAuthArea(){
  const p = personaOf(customerId);
  if (!p) {
    $('authArea').innerHTML = `<button id="signInBtn" class="persona-btn"><span class="persona-dot" style="background:#94a3b8"></span> Sign In</button>`;
    $('signInBtn').onclick = openSignIn;
    return;
  }
  $('authArea').innerHTML = `
    <button id="acctToggle" class="persona-btn">
      <span class="persona-dot"></span>
      <span>${esc(p.name)}</span>
      <span style="font-size:10px;color:var(--mute)">▾</span>
    </button>
    <div class="account-menu" id="acctMenu">
      <div class="account-menu-header">Switch Demo Shopper</div>
      ${PERSONAS.filter(x => x.id !== p.id).map(x => `
        <button data-switch="${x.id}">
          <span>${esc(x.name)}</span>
          <span style="font-size:11px;color:var(--mute)">${esc(x.note.split(',')[0])}</span>
        </button>`).join('')}
      <div class="divider"></div>
      <button id="signOutBtn"><span style="color:#ef4444">Sign out (Guest mode)</span></button>
    </div>`;
  $('acctToggle').onclick = () => $('acctMenu').classList.toggle('open');
  document.querySelectorAll('[data-switch]').forEach(b => b.onclick = () => { $('acctMenu').classList.remove('open'); switchTo(b.dataset.switch); });
  $('signOutBtn').onclick = () => { $('acctMenu').classList.remove('open'); switchTo(GUEST_ID); };
}
document.addEventListener('click', e => {
  const menu = $('acctMenu'); const toggle = $('acctToggle');
  if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== toggle) menu.classList.remove('open');
});

function openSignIn(){
  $('panelBody').innerHTML = `
    <div class="signin-panel" style="grid-column:1/-1">
      <button class="modal-close" id="closeOverlay">×</button>
      <h2>Select a Demo Customer</h2>
      <div class="sub">Pick a persona to experience real-time personalisation, price tier weighting, and sizing history.</div>
      ${PERSONAS.map(p => `
        <div class="acct-tile" data-tile="${p.id}">
          <div>
            <div class="name">${esc(p.name)}</div>
            <div class="note">${esc(p.note)}</div>
          </div>
          <div class="arrow">→</div>
        </div>`).join('')}
      <div class="guest-link">or <button id="continueGuest">continue browsing as a guest</button></div>
    </div>`;
  $('overlay').classList.add('open');
  $('closeOverlay').onclick = () => $('overlay').classList.remove('open');
  document.querySelectorAll('[data-tile]').forEach(t => t.onclick = () => { $('overlay').classList.remove('open'); switchTo(t.dataset.tile); });
  $('continueGuest').onclick = () => $('overlay').classList.remove('open');
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  currentView = b.dataset.view;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  $('view-shop').style.display = currentView === 'shop' ? '' : 'none';
  $('view-account').style.display = currentView === 'account' ? '' : 'none';
  if (currentView === 'account') renderAccountView();
});

renderAuthArea();
</script>

<script>
const TRENDING = ['Occasion dress','Winter coat','Knit jumper','Work trousers','Trainers'];
const AI_SUGGESTIONS = [
  'I am looking for warm clothes this winter',
  'Something elegant for a black tie event',
  'Comfortable workwear for long days at the office',
  'Layering pieces for unpredictable weather',
  'Weekend brunch outfit that feels effortless',
  'A gift for someone who loves fashion',
];
const CAT_ICON = { dresses:'👗', outerwear:'🧥', knitwear:'🧶', trousers:'👖', tops:'👕', skirts:'👗', footwear:'👟', accessories:'👜' };
let lastProducts = [];
let savedSkus = new Set();

function syncAiToggle(){
  const checked = $('semanticToggle').checked;
  $('aiToggleLabel').classList.toggle('active', checked);
}
$('semanticToggle').addEventListener('change', syncAiToggle);

$('search').addEventListener('input', () => {
  $('clearSearchBtn').classList.toggle('visible', !!$('search').value.trim());
});
$('clearSearchBtn').onclick = () => {
  $('search').value = '';
  $('clearSearchBtn').classList.remove('visible');
  $('search').focus();
};

$('pills').innerHTML = TRENDING.map(c => `<button class="trending-chip">${esc(c)}</button>`).join('');
document.querySelectorAll('#pills .trending-chip').forEach(p => p.onclick = () => { $('search').value = p.textContent; $('clearSearchBtn').classList.add('visible'); runSearch(); });

$('aiPills').innerHTML = AI_SUGGESTIONS.map(s => `<button class="ai-prompt-chip"><span style="color:#eab308">✦</span> ${esc(s)}</button>`).join('');
document.querySelectorAll('#aiPills .ai-prompt-chip').forEach(p => p.onclick = () => {
  $('search').value = p.textContent.replace(/^✦\s*/, '');
  $('clearSearchBtn').classList.add('visible');
  $('semanticToggle').checked = true;
  syncAiToggle();
  runSearch();
});

// Category Filter pills
document.querySelectorAll('#categoryRow .cat-pill').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#categoryRow .cat-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    renderFilteredProducts();
  };
});

$('searchBtn').onclick = runSearch;
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

function renderSkeletons() {
  $('grid').innerHTML = Array.from({length: 6}).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-media"></div>
      <div class="skeleton-body">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>`).join('');
}

async function runSearch(){
  const text = $('search').value.trim();
  if (!text) return;
  renderSkeletons();
  $('blurb').innerHTML = ''; $('resultsHead').innerHTML = '';
  const semanticSearch = $('semanticToggle').checked;
  const d = await ask(text, semanticSearch ? { semanticSearch: true } : {});
  if (d.error) {
    $('grid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <h3>Search Error</h3>
        <p>${esc(d.reply)}</p>
      </div>`;
    return;
  }
  if (d.intent !== 'discovery.rank' || !d.payload?.products) {
    $('grid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No matching products</h3>
        <p>${esc(d.reply || 'Try refining your search terms or exploring trending categories.')}</p>
      </div>`;
    return;
  }

  lastProducts = d.payload.products;
  const modeNote = d.trace?.find(t => t.label?.startsWith('catalogue.search served'));
  const modeBadge = semanticSearch
    ? `<span class="mode-badge ${modeNote?.detail?.degraded ? 'degraded' : 'hybrid'}">${modeNote?.detail?.degraded ? '⚠️ Fallback to Keyword' : '✦ Hybrid AI Match'}</span>`
    : `<span class="mode-badge lexical">Standard Match</span>`;

  $('resultsHead').innerHTML = `
    <div class="results-toolbar">
      <div class="results-meta">
        <h2 class="results-title">Results</h2>
        <span class="results-count">${d.payload.candidates} products found</span>
        ${modeBadge}
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="default">Sort: AI Recommended</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating-desc">Highest Rated</option>
      </select>
    </div>`;

  $('sortSelect').onchange = (e) => {
    currentSort = e.target.value;
    renderFilteredProducts();
  };

  const mix = Object.entries(d.payload.price_tier_mix || {}).map(([t,n]) => `<span class="mix-pill">${n} ${t.replace('_',' ')}</span>`).join('');
  const p = personaOf(customerId);
  const personaName = p ? p.name : 'You (Guest)';

  $('blurb').innerHTML = `
    <div class="ai-card">
      <div class="ai-card-header">
        <span class="ai-card-badge">✦ AI Personalised for ${esc(personaName)}</span>
        <span class="ai-card-guardrail">✓ Fairness Verified</span>
      </div>
      <div class="ai-card-body">${esc(d.payload.rationale)}</div>
      <div class="ai-card-why" id="whyToggle">
        <span>Why am I seeing this?</span> <span>▾</span>
      </div>
      <div class="ai-card-details" id="whyBody">
        <div>Ranked <b>${d.payload.candidates}</b> eligible products against affluence profile and stock availability.</div>
        <div style="margin-top:8px">Top recommendations tier distribution:</div>
        <div class="mix-badges">${mix}</div>
      </div>
    </div>`;

  $('whyToggle').onclick = () => $('whyBody').classList.toggle('open');
  renderFilteredProducts();
}

function renderFilteredProducts() {
  let list = [...lastProducts];
  if (activeCategory) {
    list = list.filter(p => p.category === activeCategory);
  }
  if (currentSort === 'price-asc') {
    list.sort((a, b) => a.price_gbp - b.price_gbp);
  } else if (currentSort === 'price-desc') {
    list.sort((a, b) => b.price_gbp - a.price_gbp);
  } else if (currentSort === 'rating-desc') {
    list.sort((a, b) => b.rating - a.rating);
  }

  if (!list.length) {
    $('grid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🧥</div>
        <h3>No products in this category</h3>
        <p>No items in the "${esc(activeCategory)}" category matched this search. Try selecting "All Items".</p>
      </div>`;
    return;
  }

  $('grid').innerHTML = list.map((p, i) => {
    const isSaved = savedSkus.has(p.sku);
    const stockClass = p.stock > 8 ? 'in-stock' : p.stock > 0 ? 'low-stock' : 'out-stock';
    const stockLabel = p.stock > 8 ? 'In stock' : p.stock > 0 ? 'Low stock' : 'Out of stock';

    return `
      <div class="product-card" data-sku="${esc(p.sku)}">
        <div class="card-media">
          ${i === 0 ? '<span class="top-pick-badge"><span class="star">✦</span> Top pick</span>' : ''}
          <button class="wishlist-btn ${isSaved ? 'saved' : ''}" data-wishlist="${esc(p.sku)}" title="Save to wishlist">
            ${isSaved ? '♥' : '♡'}
          </button>
          ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" onerror="this.remove()">` : `<span class="card-placeholder-icon">${CAT_ICON[p.category] || '🛍️'}</span>`}
        </div>
        <div class="card-details">
          <div class="card-brand">${esc(p.brand)}</div>
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-price-row">
            <div class="card-price">£${Number(p.price_gbp).toFixed(2)}</div>
          </div>
          <div class="card-meta-row">
            <span class="card-rating"><span class="star">★</span> ${p.rating}</span>
            <span class="stock-indicator">
              <span class="stock-dot ${stockClass}"></span>
              <span>${stockLabel}</span>
            </span>
          </div>
        </div>
      </div>`;
  }).join('');

  document.querySelectorAll('#grid .product-card').forEach(card => {
    card.onclick = (e) => {
      if (e.target.closest('.wishlist-btn')) return;
      const sku = card.dataset.sku;
      const prod = lastProducts.find(x => x.sku === sku);
      if (prod) openProduct(prod);
    };
  });

  document.querySelectorAll('[data-wishlist]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const sku = btn.dataset.wishlist;
      if (savedSkus.has(sku)) {
        savedSkus.delete(sku);
        btn.classList.remove('saved');
        btn.textContent = '♡';
      } else {
        savedSkus.add(sku);
        btn.classList.add('saved');
        btn.textContent = '♥';
      }
    };
  });
}
</script>

<script>
function openProduct(p){
  $('panelBody').innerHTML = `
    <button class="modal-close" id="closeOverlay">×</button>
    <div class="panel-media">
      ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}" onerror="this.remove()">` : `<span style="font-size:80px">${CAT_ICON[p.category] || '🛍️'}</span>`}
    </div>
    <div class="pd-info">
      <div class="pd-brand">${esc(p.brand)}</div>
      <h2>${esc(p.title)}</h2>
      <div class="pd-price">£${Number(p.price_gbp).toFixed(2)}</div>
      <div class="pd-meta">★ ${p.rating} · ${p.stock > 8 ? 'In stock' : p.stock > 0 ? 'Low stock' : 'Out of stock'}</div>

      <div class="size-label">
        <span class="caps">Select Size</span>
        <span id="aiTag" class="ai-tag"></span>
      </div>
      <div class="size-row" id="sizeRow">
        ${['XS','S','M','L','XL'].map(s => `<button class="size-box" data-size="${s}">${s}</button>`).join('')}
      </div>
      <div class="size-note" id="sizeNote">Finding optimal fit…</div>

      <button class="btn-primary" id="addBag">Add to bag</button>
    </div>
  `;
  $('overlay').classList.add('open');
  $('closeOverlay').onclick = () => $('overlay').classList.remove('open');

  document.querySelectorAll('#sizeRow .size-box').forEach(box => box.onclick = () => {
    document.querySelectorAll('#sizeRow .size-box').forEach(b => b.classList.remove('selected'));
    box.classList.add('selected');
  });

  $('addBag').onclick = () => {
    cartCount++;
    $('cartCount').textContent = String(cartCount);
    $('addBag').textContent = 'Added to Bag ✓';
    setTimeout(() => { $('addBag').textContent = 'Add to bag'; }, 1500);
  };

  ask(`what size should I get for ${p.sku}?`).then(d => {
    if (d.error) { $('sizeNote').textContent = ''; return; }
    const f = d.payload || {};
    if (f.abstained) {
      $('sizeNote').innerHTML = `${esc(f.explanation)} <span class="why-fit" id="whyFit">Why? ▾</span><div class="why-body" id="whyFitBody" style="display:none;margin-top:6px;padding:8px;background:var(--canvas);border-radius:6px">${esc(JSON.stringify(f.evidence || {}))}</div>`;
    } else {
      $('aiTag').textContent = `✦ AI pick: ${f.recommended_size} (${f.confidence}%)`;
      document.querySelectorAll('#sizeRow .size-box').forEach(box => {
        if (box.dataset.size === f.recommended_size) {
          box.classList.add('ai-pick');
          box.classList.add('selected');
        }
      });
      $('sizeNote').innerHTML = `${esc(f.explanation)} <span class="why-fit" id="whyFit">Why? ▾</span><div class="why-body" id="whyFitBody" style="display:none;margin-top:6px;padding:8px;background:var(--canvas);border-radius:6px">Body-metric match ${f.evidence?.grading_delta}σ from typical ${f.recommended_size} · ${f.evidence?.observations} kept purchases · brand cut ${esc(String(f.evidence?.brand_cut || ''))}</div>`;
    }
    const whyFit = $('whyFit');
    if (whyFit) whyFit.onclick = () => {
      const b = $('whyFitBody');
      b.style.display = b.style.display === 'none' ? 'block' : 'none';
    };
  });
}
</script>

<script>
async function renderAccountView(){
  if (!isSignedIn()) {
    $('view-account').innerHTML = `
      <div class="gate">
        <p>Sign in to view your profile, subscription and loyalty points.</p>
        <button id="gateSignIn" class="btn-primary" style="max-width:200px">Sign In</button>
      </div>`;
    $('gateSignIn').onclick = openSignIn;
    return;
  }
  $('view-account').innerHTML = `
    <div class="cards-2">
      <div class="acct-card"><h3>Profile</h3><div id="profileBody" class="empty">Loading…</div></div>
      <div class="acct-card"><h3>Subscription</h3><div id="subBody" class="empty">Loading…</div></div>
    </div>
    <div class="acct-card">
      <h3>Loyalty points</h3>
      <div id="loyaltyBody" class="empty">Simulate a purchase to see your balance and tier progress.</div>
      <button class="btn-ghost" id="simPurchase">Simulate a purchase</button>
      <div class="redeem-row">
        <input type="number" id="redeemAmt" placeholder="Points" min="0">
        <button id="redeemBtn">Redeem</button>
      </div>
      <div id="redeemResult"></div>
    </div>`;

  const p = await ask('who am I');
  if (!p.error && p.payload?.segment) {
    const seg = p.payload.segment;
    $('profileBody').innerHTML = `<div><b>${esc(String(seg.affluence).replace('_',' '))}</b> · ${esc(seg.loyalty_status)}
      <div class="meta" style="color:var(--mute);margin-top:6px">Tier ${esc(seg.tier)} · ${seg.evidence.orders} orders · ${seg.evidence.tenure_days} days as a customer</div></div>`;
  }

  const u = await ask('tell me about the styling advisory plan');
  if (u.error) { $('subBody').innerHTML = `<p class="empty">${esc(u.reply)}</p>`; }
  else if (u.payload?.offer) {
    $('subBody').innerHTML = `<p>${esc(u.payload.offer.copy)}</p>
      <button class="btn-primary" id="acceptOffer">Accept · £${u.payload.offer.price_gbp_month}/mo</button>`;
    $('acceptOffer').onclick = async () => { const a = await ask('accept'); $('subBody').innerHTML = `<p>${esc(a.reply)}</p>`; };
  } else {
    $('subBody').innerHTML = `<p class="empty">${esc(u.reply)}</p>`;
  }

  $('simPurchase').onclick = async () => {
    $('loyaltyBody').innerHTML = '<p class="empty">Recording purchase…</p>';
    const d = await ask('how many points did I earn?');
    if (d.error) { $('loyaltyBody').innerHTML = `<p class="empty">${esc(d.reply)}</p>`; return; }
    const r = d.payload || {};
    const pct = r.tier === 'Platinum' ? 100 : Math.max(4, 100 - Math.min(100, (r.points_to_next_tier || 0) / 20));
    $('loyaltyBody').innerHTML = `<p>${esc(r.nudge || d.reply)}</p>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="meta" style="color:var(--mute);margin-top:6px">Balance <b>${r.balance}</b> · Tier ${esc(r.tier || '')}</div>`;
  };

  $('redeemBtn').onclick = async () => {
    const n = $('redeemAmt').value;
    if (!n) return;
    const d = await ask(`redeem ${n}`);
    $('redeemResult').innerHTML = `<p class="meta" style="color:var(--mute);margin-top:6px">${esc(d.reply)}</p>`;
  };
}
</script>
</body>
</html>
